[workspace]
members = ["crates/alm-core", "crates/alm-store"]
resolver = "3"

[workspace.dependencies]
alm-core = { path = "crates/alm-core" }
alm-store = { path = "crates/alm-store" }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[package]
name = "alm_phase2_local"
version = "0.1.0"
edition = "2024"

[dependencies]
alm-store = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
