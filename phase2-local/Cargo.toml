[workspace]
members = ["crates/alm-cli", "crates/alm-core", "crates/alm-store"]
resolver = "3"

[workspace.dependencies]
alm-core = { path = "crates/alm-core" }
alm-store = { path = "crates/alm-store" }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
