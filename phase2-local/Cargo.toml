[workspace]
members = [
    "crates/alm-app",
    "crates/alm-cli",
    "crates/alm-core",
    "crates/alm-store",
    "crates/alm-sync",
]
resolver = "3"

[workspace.dependencies]
alm-core = { path = "crates/alm-core" }
alm-store = { path = "crates/alm-store" }
postgres = { version = "=0.19.14", features = ["with-serde_json-1"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
