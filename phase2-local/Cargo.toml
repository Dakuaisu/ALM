[workspace]
members = [
    "crates/alm-app",
    "crates/alm-cli",
    "crates/alm-core",
    "crates/alm-store",
    "crates/alm-sync",
]
resolver = "3"

[workspace.dependencies]
ab_glyph = "=0.2.32"
alm-core = { path = "crates/alm-core" }
alm-store = { path = "crates/alm-store" }
alm-sync = { path = "crates/alm-sync" }
postgres = { version = "=0.19.14", features = ["with-serde_json-1"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = "=3.5.2"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
