[package]
name = "alm-sync"
version = "0.1.0"
edition = "2024"

[features]
# The journaled development simulation over the synthetic seeded fixture; only alm-app enables it.
local-authority = ["alm-core/demo-fixture"]

[dependencies]
alm-core = { workspace = true }
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
alm-core = { workspace = true, features = ["demo-fixture"] }
alm-sync = { path = ".", features = ["local-authority"] }
postgres.workspace = true
