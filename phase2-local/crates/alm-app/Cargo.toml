[package]
name = "alm-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "alm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alm-app"
path = "src/main.rs"

[dev-dependencies]
alm-core = { workspace = true, features = ["demo-fixture", "test-support"] }

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
ab_glyph = { workspace = true }
alm-core = { workspace = true, features = ["demo-fixture"] }
alm-store = { workspace = true }
alm-sync = { workspace = true, features = ["local-authority"] }
serde = { workspace = true }
tiny-skia = { workspace = true }
tauri = { version = "=2.12.7", features = [] }
