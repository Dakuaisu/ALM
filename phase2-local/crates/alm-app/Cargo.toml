[package]
name = "alm-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "alm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alm-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
alm-core = { workspace = true }
alm-store = { workspace = true }
serde = { workspace = true }
tauri = { version = "=2.12.7", features = [] }
