# Server checks on Linux: disposable postgres:17 (+ pgTAP), GoTrue and PostgREST containers on
# 127.0.0.1, the plain-Postgres bootstrap and every migration in order, then pgTAP and the
# opt-in server suites (phase2-local/scripts/server_checks.sh). The JWT secret and passwords are
# generated inside the job. The scale tests' 5x timing checks are off (ALM_SKIP_PERF=1).
name: server checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase2-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - name: Tauri build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Fetch crates
        run: cargo fetch --locked
      - name: Build the server suites
        run: |
          cargo test --locked --offline --no-run -p alm-sync \
            --test conformance_postgres --test differential_postgres --test postgres_authority \
            --test postgres_replay --test rest_authority --test gotrue_session --test randomized
          cargo test --locked --offline --no-run -p alm-app --lib
      - name: Server checks
        env:
          ALM_SKIP_PERF: "1"
        run: ./scripts/server_checks.sh
