# Windows leg of the Tauri trial: runs the Rust tests and clippy, then builds the NSIS installer
# with the Tauri CLI and keeps it as the run's artifact. Launching the app on a real PC remains a
# manual check. The alm-store test `milestone_d_replay` compares the bill output with the frozen
# HTML (ALM_Business_Manager.html), which is not in the repository, so it runs only on a
# machine that holds that file (docs/RESULTS.md lists it as not run here).
name: alm-app windows build

on:
  push:
    paths: ["phase2-local/**", ".github/workflows/alm-app-windows.yml"]
  pull_request:
    paths: ["phase2-local/**", ".github/workflows/alm-app-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phase2-local
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - name: Test targets without the frozen HTML
        id: targets
        run: |
          $store = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'alm-store'
          $tests = $store.targets | Where-Object { $_.kind -contains 'test' -and $_.name -ne 'milestone_d_replay' } |
            ForEach-Object { "--test $($_.name)" }
          "store=$($tests -join ' ')" >> $env:GITHUB_OUTPUT
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: |
          cargo test --locked --workspace --exclude alm-store
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-Expression "cargo test --locked -p alm-store --lib ${{ steps.targets.outputs.store }}"
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --exclude alm-store --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-Expression "cargo clippy --locked -p alm-store --lib ${{ steps.targets.outputs.store }} -- -D warnings"
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.6 --locked
      - name: Build the installer
        working-directory: phase2-local/crates/alm-app
        run: cargo tauri build --bundles nsis -- --locked
      - name: Installer size
        run: Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - uses: actions/upload-artifact@v4
        with:
          name: alm-app-windows-installer
          path: phase2-local/target/release/bundle/nsis/*.exe
          if-no-files-found: error
