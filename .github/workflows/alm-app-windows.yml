# Windows leg of the Tauri trial: runs the Rust tests and clippy, then builds the NSIS installer
# with the Tauri CLI, installs it silently, waits for the minimized app to write its device ID
# while still running, uninstalls it silently, and
# keeps the installer as the run's artifact. Print and real sharing on a Windows PC remain manual
# checks. The alm-store test `milestone_d_replay` compares the bill output with the frozen
# HTML (ALM_Business_Manager.html, read when the test runs), which is not in the repository, so
# it is built and linted here but runs only on a machine that holds that file. The scale tests'
# 5x timing checks compare with the development Mac's debug times, so they are skipped here.
name: alm-app windows build

on:
  push:
    paths: ["phase2-local/**", ".github/workflows/alm-app-windows.yml"]
  pull_request:
    paths: ["phase2-local/**", ".github/workflows/alm-app-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phase2-local
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - name: Test targets without the frozen HTML
        id: targets
        run: |
          $store = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'alm-store'
          $tests = $store.targets | Where-Object { $_.kind -contains 'test' -and $_.name -ne 'milestone_d_replay' } |
            ForEach-Object { "--test $($_.name)" }
          "store=$($tests -join ' ')" >> $env:GITHUB_OUTPUT
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        env:
          ALM_SKIP_PERF: "1"
        run: |
          cargo test --locked --no-fail-fast --workspace --exclude alm-store
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-Expression "cargo test --locked --no-fail-fast -p alm-store --lib ${{ steps.targets.outputs.store }}"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.6 --locked
      - name: Build the installer
        working-directory: phase2-local/crates/alm-app
        run: cargo tauri build --bundles nsis -- --locked
      - name: Installer size
        run: Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - name: Install, launch and uninstall
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'ALM Trial'
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
          if (-not $app) { Get-ChildItem $dir -Recurse; throw "no installed app in $dir" }
          "installed: $($app.FullName) $($app.Length) bytes"
          $data = Join-Path $env:APPDATA 'in.alm.trial'
          $deviceId = Join-Path $data 'device-id.txt'
          $stderr = Join-Path $env:RUNNER_TEMP "alm-launch-$([guid]::NewGuid()).stderr.log"
          $run = $null
          try {
            $run = Start-Process $app.FullName -WindowStyle Minimized -RedirectStandardError $stderr -PassThru
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not (Test-Path -LiteralPath $deviceId -PathType Leaf)) {
              $remaining = 90000 - $clock.ElapsedMilliseconds
              if ($remaining -le 0) { throw "timed out after 90 seconds waiting for $deviceId" }
              if ($run.WaitForExit([int][Math]::Min(2000, $remaining))) {
                throw "the app exited with code $($run.ExitCode) before readiness"
              }
            }
            if ($run.HasExited) { throw "the app exited with code $($run.ExitCode) at readiness" }
            "running: pid $($run.Id)"
          } catch {
            'App stderr:'
            if (Test-Path -LiteralPath $stderr -PathType Leaf) {
              Get-Content -LiteralPath $stderr -ErrorAction Continue
            }
            "APPDATA listing ($env:APPDATA):"
            Get-ChildItem -LiteralPath $env:APPDATA -Force -ErrorAction Continue | ForEach-Object { $_.Name }
            throw
          } finally {
            if ($run -and -not $run.HasExited) {
              Stop-Process -InputObject $run -Force -ErrorAction SilentlyContinue
              if (-not $run.WaitForExit(5000)) { throw "could not stop app pid $($run.Id)" }
            }
          }
          Get-ChildItem $data | ForEach-Object { "app data: $($_.Name)" }
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw "the app is still installed" }
          "uninstalled"
      - uses: actions/upload-artifact@v4
        with:
          name: alm-app-windows-installer
          path: phase2-local/target/release/bundle/nsis/*.exe
          if-no-files-found: error
